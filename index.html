<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>师小联课表 - 盐城师范学院课表查询系统</title>
  <meta name="description" content="盐城师范学院官方全覆盖课表查询系统，支持按专业-班级精准查询，提供每周课表与总课表智能切周体验。">
  
  <!-- Open Graph Tags for WeChat/Facebook/LinkedIn Sharing -->
  <meta property="og:title" content="师小联课表 - 盐城师范学院课表查询系统">
  <meta property="og:description" content="盐城师范学院全覆盖课表查询，支持专业-班级精准查询，每周课表与总课表智能切换">
  <meta property="og:image" content="https://spontaneous-muffin-553478.netlify.app/share-icon.jpg">
  <meta property="og:url" content="https://spontaneous-muffin-553478.netlify.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="师小联课表">
  
  <!-- WeChat Specific Tags -->
  <meta name="wx:title" content="师小联课表 - 盐城师范学院课表查询系统">
  <meta name="wx:description" content="盐城师范学院全覆盖课表查询，支持专业-班级精准查询，每周课表与总课表智能切换">
  <meta name="wx:image" content="https://spontaneous-muffin-553478.netlify.app/share-icon.jpg">
  
  <!-- Twitter Card Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="师小联课表 - 盐城师范学院课表查询系统">
  <meta name="twitter:description" content="盐城师范学院全覆盖课表查询，支持专业-班级精准查询">
  <meta name="twitter:image" content="https://spontaneous-muffin-553478.netlify.app/share-icon.jpg">
  
  <link rel="stylesheet" href="index.css">
  <!-- Load inline dataset -->
  <script src="schedule_data.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand-section">
        <img class="brand-icon" src="LOGO.png" alt="Logo">
        <div class="brand-title-wrap">
          <h1 class="brand-title">师小联课表</h1>
          <span class="brand-subtitle">盐城师范学院 · 2025-2026-1</span>
        </div>
      </div>
    </header>

    <!-- Query Selector Card (专业 -> 班级 100% 对齐) -->
    <section class="selector-card">
      <div class="selector-row">
        <span class="selector-badge">专 业</span>
        <div class="selector-trigger" id="majorTrigger">
          <span class="selector-value" id="currentMajorName">选择专业...</span>
          <span style="font-size:12px; color:var(--text-muted);">▼</span>
        </div>
      </div>
      <div class="selector-row">
        <span class="selector-badge">班 级</span>
        <div class="selector-trigger" id="classTrigger">
          <span class="selector-value" id="currentClassName">选择班级...</span>
          <span style="font-size:12px; color:var(--text-muted);">▼</span>
        </div>
      </div>
    </section>

    <!-- Control Bar (Tabs & Week Scroller) -->
    <section class="control-bar">
      <div class="view-tabs">
        <div class="tab-item active" id="tabWeekly" data-view="weekly">每周课表</div>
        <div class="tab-item" id="tabTotal" data-view="total">总课表</div>
      </div>

      <div class="week-scroller-wrap" id="weekScrollerWrap">
        <div class="week-scroll-list" id="weekScrollList">
          <!-- 1-20周 chips will be rendered via JS -->
        </div>
      </div>
    </section>

    <!-- Main Timetable Display -->
    <main class="timetable-section">
      
      <!-- Days Header -->
      <div class="days-header">
        <div class="day-header-cell" style="border:none; background:transparent;"></div>
        <div class="day-header-cell" data-day="1">
          <div class="day-name">周一</div>
          <div class="day-sub" id="subDay1">Mon</div>
        </div>
        <div class="day-header-cell" data-day="2">
          <div class="day-name">周二</div>
          <div class="day-sub" id="subDay2">Tue</div>
        </div>
        <div class="day-header-cell" data-day="3">
          <div class="day-name">周三</div>
          <div class="day-sub" id="subDay3">Wed</div>
        </div>
        <div class="day-header-cell" data-day="4">
          <div class="day-name">周四</div>
          <div class="day-sub" id="subDay4">Thu</div>
        </div>
        <div class="day-header-cell" data-day="5">
          <div class="day-name">周五</div>
          <div class="day-sub" id="subDay5">Fri</div>
        </div>
        <div class="day-header-cell" data-day="6">
          <div class="day-name">周六</div>
          <div class="day-sub" id="subDay6">Sat</div>
        </div>
        <div class="day-header-cell" data-day="7">
          <div class="day-name">周日</div>
          <div class="day-sub" id="subDay7">Sun</div>
        </div>
      </div>

      <!-- Timetable Grid -->
      <div class="timetable-grid" id="timetableGrid">
        <!-- Period Column (1..12) and Day Columns (1..7) generated by JS -->
      </div>

      <!-- Other Courses Section -->
      <div class="other-courses-card" id="otherCoursesSection" style="display:none;">
        <div class="other-courses-title">📌 其他课程 / 实践环节</div>
        <div id="otherCoursesList"></div>
      </div>

    </main>

  </div>

  <!-- Major Picker Drawer -->
  <div class="modal-overlay" id="majorDrawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <h2 class="drawer-title">选择专业</h2>
        <button class="drawer-close closeDrawerBtn">✕</button>
      </div>
      <input type="text" class="picker-search" id="majorSearchInput" placeholder="输入专业名称搜索 (如: 计算机, 英语, 数学)...">
      <div class="picker-list" id="majorPickerList"></div>
    </div>
  </div>

  <!-- Class Picker Drawer -->
  <div class="modal-overlay" id="classDrawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <h2 class="drawer-title" id="classDrawerTitle">选择班级</h2>
        <button class="drawer-close closeDrawerBtn">✕</button>
      </div>
      <div class="picker-list" id="classPickerList"></div>
    </div>
  </div>

  <!-- Course Detail Drawer -->
  <div class="modal-overlay" id="detailDrawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <h2 class="drawer-title" id="detailCourseName">课程名称</h2>
        <button class="drawer-close closeDrawerBtn">✕</button>
      </div>
      <div class="drawer-body">
        <div class="detail-tag-row" id="detailTags"></div>
        <div class="detail-info-grid">
          <div class="detail-info-item">
            <div class="detail-info-label">授课教师</div>
            <div class="detail-info-val" id="detailTeacher">--</div>
          </div>
          <div class="detail-info-item">
            <div class="detail-info-label">上课地点</div>
            <div class="detail-info-val" id="detailLocation">--</div>
          </div>
          <div class="detail-info-item">
            <div class="detail-info-label">所在校区</div>
            <div class="detail-info-val" id="detailCampus">--</div>
          </div>
          <div class="detail-info-item">
            <div class="detail-info-label">上课周次</div>
            <div class="detail-info-val" id="detailWeeks">--</div>
          </div>
          <div class="detail-info-item">
            <div class="detail-info-label">节次安排</div>
            <div class="detail-info-val" id="detailSections">--</div>
          </div>
          <div class="detail-info-item">
            <div class="detail-info-label">学分 / 学时</div>
            <div class="detail-info-val" id="detailCreditHours">--</div>
          </div>
        </div>
        <div class="detail-info-item" style="margin-top:4px;">
          <div class="detail-info-label">教学班代码</div>
          <div class="detail-info-val" id="detailCode" style="font-size:11px; word-break:break-all;">--</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Message -->
  <div class="toast" id="toastMsg">已保存选择</div>

  <!-- Main App Script -->
  <script src="app.js"></script>

<!-- WeChat Share Configuration -->
<script>
(function() {
  var shareData = {
    title: '师小联课表 - 盐城师范学院课表查询系统',
    desc: '盐城师范学院全覆盖课表查询，支持专业-班级精准查询，每周课表与总课表智能切换',
    link: 'https://spontaneous-muffin-553478.netlify.app/',
    imgUrl: 'https://spontaneous-muffin-553478.netlify.app/share-icon.jpg'
  };

  function setShareData() {
    if (typeof WeixinJSBridge === 'undefined') {
      if (document.addEventListener) {
        document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
      } else if (document.attachEvent) {
        document.attachEvent('WeixinJSBridgeReady', onBridgeReady);
        document.attachEvent('onWeixinJSBridgeReady', onBridgeReady);
      }
    } else {
      onBridgeReady();
    }
  }

  function onBridgeReady() {
    try {
      WeixinJSBridge.on('menu:share:appmessage', function(argv) {
        WeixinJSBridge.invoke('sendAppMessage', {
          title: shareData.title,
          desc: shareData.desc,
          link: shareData.link,
          img_url: shareData.imgUrl
        }, function(res) {});
      });

      WeixinJSBridge.on('menu:share:timeline', function(argv) {
        WeixinJSBridge.invoke('shareTimeline', {
          title: shareData.title,
          link: shareData.link,
          img_url: shareData.imgUrl
        }, function(res) {});
      });

      WeixinJSBridge.on('menu:share:qq', function(argv) {
        WeixinJSBridge.invoke('shareQQ', {
          title: shareData.title,
          desc: shareData.desc,
          link: shareData.link,
          img_url: shareData.imgUrl
        }, function(res) {});
      });

      WeixinJSBridge.on('menu:share:weiboApp', function(argv) {
        WeixinJSBridge.invoke('shareWeibo', {
          title: shareData.title,
          desc: shareData.desc,
          link: shareData.link,
          img_url: shareData.imgUrl
        }, function(res) {});
      });
    } catch (e) {
      console.log('WeixinJSBridge error:', e);
    }
  }

  setShareData();
})();
</script>

<!-- WeChat JS-SDK for better compatibility -->
<script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
<script>
wx.config({
  debug: false,
  appId: '',
  timestamp: 0,
  nonceStr: '',
  signature: '',

});

wx.ready(function() {
  try {
    wx.updateAppMessageShareData({
      title: '师小联课表 - 盐城师范学院课表查询系统',

      link: 'https://spontaneous-muffin-553478.netlify.app/',
      imgUrl: 'https://spontaneous-muffin-553478.netlify.app/share-icon.jpg',
      success: function() {}
    });

    wx.updateTimelineShareData({

      imgUrl: 'https://spontaneous-muffin-553478.netlify.app/share-icon.jpg',
      success: function() {}
    });
  } catch (e) {
    console.log('wx.ready error:', e);
  }
});
</script>
</body>
</html>
